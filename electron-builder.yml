appId: com.gamma.pos
productName: Gamma POS
copyright: Copyright © 2026 Gamma Retail Systems
directories:
  output: dist-release
files:
  - dist/**/*
  - package.json

publish:
  provider: github
  owner: alinrbassam
  repo: gamma-pos
  releaseType: release

win:
  icon: build/icon.ico
  forceCodeSigning: false
  artifactName: "Gamma-POS-Setup-${version}.${ext}"
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Gamma POS
  uninstallDisplayName: Gamma POS

extraMetadata:
  main: dist/main/index.js
  author: Gamma Retail Systems
