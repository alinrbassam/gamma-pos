appId: com.zabad.pos
productName: Khalil POS
copyright: Copyright © 2026 Khalil Retail Systems
directories:
  output: dist-release
files:
  - dist/**/*
  - package.json

publish:
  provider: github
  owner: alinrbassam
  repo: Zabad
  releaseType: release

win:
  icon: build/icon.ico
  forceCodeSigning: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Khalil POS
  uninstallDisplayName: Khalil POS

extraMetadata:
  main: dist/main/index.js
  author: Zabad Retail Systems
